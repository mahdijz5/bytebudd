services:
  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: bytebudd-nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - bytebudd-net

  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Pass proxy settings at build time if needed.
      # Set these in your shell environment before running docker compose up.
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    container_name: bytebudd-backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://bytebudd:bytebudd_secret@postgres:5432/bytebudd}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-use-strong-secret}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:14b}
      - OLLAMA_TIMEOUT=120
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-32-char-encryption-key!}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:3000}
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - bytebudd-net

  # ── Next.js frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: bytebudd-frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NODE_ENV=development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/.next:/app/.next
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped
    networks:
      - bytebudd-net

  # ── PostgreSQL (ByteBudd internal DB) ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bytebudd-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=bytebudd
      - POSTGRES_USER=bytebudd
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bytebudd_secret}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bytebudd -d bytebudd"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - bytebudd-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bytebudd-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bytebudd.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - bytebudd-net
    restart: unless-stopped

  # ── MySQL (sample target DB for testing) ──────────────────────────────────
  # mysql:
  #   image: mysql:8.0
  #   container_name: bytebudd-mysql
  #   ports:
  #     - "3307:3306"
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_secret}
  #     - MYSQL_DATABASE=sample_db
  #     - MYSQL_USER=sample_user
  #     - MYSQL_PASSWORD=${MYSQL_PASSWORD:-sample_password}
  #   volumes:
  #     - ./data/mysql:/var/lib/mysql
  #     - ./infrastructure/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sample_user", "-psample_password"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #   restart: unless-stopped
  #   networks:
  #     - bytebudd-net

  # ── Qdrant (Vector Database for RAG) ──────────────────────────────────────
  qdrant:
    image: qdrant/qdrant
    container_name: bytebudd-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped
    networks:
      - bytebudd-net

  # ── Go RAG Service ────────────────────────────────────────────────────────
  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: bytebudd-rag-service
    environment:
      - PORT=8081
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - OLLAMA_URL=http://host.docker.internal:11434
      - EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-embeddinggemma}
      - CHAT_MODEL=${RAG_CHAT_MODEL:-qwen3:4b}
      - VECTOR_SIZE=${RAG_VECTOR_SIZE:-768}
      - COLLECTION_NAME=${RAG_COLLECTION_NAME:-documents}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:3000}
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=100
      - TOP_K=3
    ports:
      - "8081:8081"
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - bytebudd-net

networks:
  bytebudd-net:
    driver: bridge

volumes:
  pgadmin_data:
  frontend_node_modules:
